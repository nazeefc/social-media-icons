```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Social Media Buttons</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome 6.7.2 -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <div class="wrapper">

        <!-- Facebook -->
        <div class="button">
            <div class="icon">
                <i class="fa-brands fa-facebook-f"></i>
            </div>
            <span>Facebook</span>
        </div>

        <!-- Twitter -->
        <div class="button">
            <div class="icon">
                <i class="fa-brands fa-twitter"></i>
            </div>
            <span>Twitter</span>
        </div>

        <!-- Instagram -->
        <div class="button">
            <div class="icon">
                <i class="fa-brands fa-instagram"></i>
            </div>
            <span>Instagram</span>
        </div>

        <!-- GitHub -->
        <div class="button">
            <div class="icon">
                <i class="fa-brands fa-github"></i>
            </div>
            <span>GitHub</span>
        </div>

        <!-- YouTube -->
        <div class="button">
            <div class="icon">
                <i class="fa-brands fa-youtube"></i>
            </div>
            <span>YouTube</span>
        </div>

    </div>

</body>
</html>
```
